

apply plugin: 'java'
apply plugin: 'application'

jar {
    archiveBaseName = 'SecureRandomStringGenerator'
    archiveVersion =  '1.0.1'
    manifest {
        attributes 'Main-Class': 'amdegregorio.securerandomstring.SecureRandomStringGenerator'
    }
}

application {
    mainClass = 'amdegregorio.securerandomstring.SecureRandomStringGenerator'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation (
       'com.google.guava:guava:33.7.2-jre'
    )
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
         events "passed", "failed", "skipped"
    }
}